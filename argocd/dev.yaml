apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: crud-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/crud-app-gitops.git
    targetRevision: main
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: crud-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true